<!DOCTYPE html>
<html>
<head>
    <title>Online Quiz</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#0d6efd;
        }

        .question{
            background:white;
            padding:20px;
            margin:20px auto;
            width:80%;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h3{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin:8px 0;
            font-size:18px;
        }

        button{
            display:block;
            margin:30px auto;
            background:#0d6efd;
            color:white;
            padding:12px 30px;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:18px;
        }

        button:hover{
            background:#084298;
        }

        .back{
            text-align:center;
            margin-top:20px;
        }

        .back a{
            text-decoration:none;
            color:#0d6efd;
            font-size:18px;
        }
    </style>
</head>

<body>

<h1>Online Quiz</h1>

<form method="POST">

{% for q in questions %}

<div class="question">

<h3>{{ q.question }}</h3>

<label>
<input type="radio" name="q{{ q.id }}" value="{{ q.option1 }}">
{{ q.option1 }}
</label>

<label>
<input type="radio" name="q{{ q.id }}" value="{{ q.option2 }}">
{{ q.option2 }}
</label>

<label>
<input type="radio" name="q{{ q.id }}" value="{{ q.option3 }}">
{{ q.option3 }}
</label>

<label>
<input type="radio" name="q{{ q.id }}" value="{{ q.option4 }}">
{{ q.option4 }}
</label>

</div>

{% endfor %}

<button type="submit">Submit Quiz</button>

</form>

<div class="back">
    <a href="/dashboard">⬅ Back to Dashboard</a>
</div>

</body>
</html>
