<!DOCTYPE html>
<html>
<head>
    <title>Video Lectures</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#0d6efd;
        }

        .video{
            width:80%;
            margin:25px auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        .video h2{
            color:#0d6efd;
            margin-bottom:15px;
        }

        iframe{
            width:100%;
            height:450px;
            border:none;
            border-radius:10px;
        }

        .back{
            text-align:center;
            margin-top:30px;
        }

        .back a{
            background:#0d6efd;
            color:white;
            padding:12px 25px;
            text-decoration:none;
            border-radius:5px;
        }

        .back a:hover{
            background:#084298;
        }
    </style>

</head>

<body>

<h1>Video Lectures</h1>

{% if videos %}

    {% for video in videos %}

    <div class="video">

        <h2>{{ video.title }}</h2>

        <iframe
            src="{{ video.youtube_link }}"
            allowfullscreen>
        </iframe>

    </div>

    {% endfor %}

{% else %}

<h3 style="text-align:center;">No videos available.</h3>

{% endif %}

<div class="back">
    <a href="/dashboard">⬅ Back to Dashboard</a>
</div>

</body>
</html>
