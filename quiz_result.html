<!DOCTYPE html>
<html>
<head>
    <title>Quiz Result</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            background:#f2f2f2;
            padding-top:100px;
        }

        .box{
            width:400px;
            margin:auto;
            background:white;
            padding:40px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h1{
            color:green;
        }

        a{
            text-decoration:none;
            background:#0d6efd;
            color:white;
            padding:10px 20px;
            border-radius:5px;
        }
    </style>

</head>

<body>

<div class="box">

<h1>Quiz Completed!</h1>

<h2>Your Score</h2>

<h1>{{ score }} / {{ total }}</h1>

<br>

<a href="/dashboard">Back to Dashboard</a>

</div>

</body>
</html>
