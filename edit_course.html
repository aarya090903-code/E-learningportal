<!DOCTYPE html>
<html>
<head>
    <title>Edit Course</title>

    <style>
        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .box{
            width:450px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#0d6efd;
        }

        input, textarea{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:12px;
            background:#0d6efd;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        a{
            text-decoration:none;
            display:block;
            text-align:center;
            margin-top:15px;
        }
    </style>

</head>

<body>

<div class="box">

<h2>Edit Course</h2>

<form method="POST">

<input
type="text"
name="course_name"
value="{{ course.course_name }}"
required>

<textarea
name="description"
required>{{ course.description }}</textarea>

<input
type="text"
name="image"
value="{{ course.image }}"
required>

<button type="submit">
Update Course
</button>

</form>

<a href="/admin_dashboard">⬅ Back</a>

</div>

</body>
</html>
