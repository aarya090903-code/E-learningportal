<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Government School E-Learning Portal</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f7fb;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .register-container {

            width: 1000px;
            max-width: 95%;
            min-height: 600px;

            background: white;

            display: flex;

            border-radius: 18px;

            overflow: hidden;

            box-shadow: 0 10px 35px rgba(0,0,0,0.18);
        }


        /* LEFT IMAGE */

        .image-section {

            width: 55%;

            position: relative;

            background-image:
            url("{{ url_for('static', filename='images/school.jpg') }}");

            background-size: cover;

            background-position: center;
        }


        .image-section::after {

            content: "";

            position: absolute;

            inset: 0;

            background: linear-gradient(
                rgba(0, 72, 120, 0.30),
                rgba(0, 72, 120, 0.65)
            );
        }


        .image-content {

            position: absolute;

            z-index: 2;

            bottom: 60px;

            left: 45px;

            right: 40px;

            color: white;
        }


        .image-content h1 {

            font-size: 42px;

            margin-bottom: 15px;
        }


        .image-content p {

            font-size: 18px;

            line-height: 1.6;
        }


        /* REGISTER SECTION */

        .register-section {

            width: 45%;

            padding: 45px 50px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .logo {

            text-align: center;

            font-size: 30px;

            font-weight: bold;

            color: #0759a5;

            margin-bottom: 8px;
        }


        .subtitle {

            text-align: center;

            color: #777;

            margin-bottom: 25px;
        }


        h2 {

            text-align: center;

            color: #222;

            margin-bottom: 22px;
        }


        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }


        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 16px;

            border: 1px solid #ccc;

            border-radius: 7px;

            font-size: 15px;

            outline: none;
        }


        input:focus {

            border-color: #0d6efd;

            box-shadow:
            0 0 4px rgba(13,110,253,0.3);
        }


        button {

            width: 100%;

            padding: 14px;

            background: #0d6efd;

            color: white;

            border: none;

            border-radius: 7px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;
        }


        button:hover {

            background: #084298;
        }


        .login-link {

            text-align: center;

            margin-top: 22px;

            color: #555;
        }


        .login-link a {

            color: #0d6efd;

            font-weight: bold;

            text-decoration: none;
        }


        .login-link a:hover {

            text-decoration: underline;
        }


        .home-link {

            text-align: center;

            margin-top: 12px;
        }


        .home-link a {

            color: #555;

            text-decoration: none;
        }


        /* MOBILE */

        @media (max-width: 750px) {

            .register-container {

                flex-direction: column;
            }

            .image-section {

                width: 100%;

                height: 280px;
            }

            .register-section {

                width: 100%;

                padding: 40px 30px;
            }

            .image-content {

                bottom: 30px;

                left: 30px;
            }

            .image-content h1 {

                font-size: 30px;
            }

        }

    </style>

</head>


<body>


<div class="register-container">


    <!-- LEFT IMAGE -->

    <div class="image-section">

        <div class="image-content">

            <h1>Government School</h1>

            <p>

                Start your digital learning journey.

                Access courses, study notes,

                video lectures and quizzes.

            </p>

        </div>

    </div>



    <!-- RIGHT REGISTER -->

    <div class="register-section">


        <div class="logo">

            🎓 E-Learning Portal

        </div>


        <p class="subtitle">

            Government School Digital Learning

        </p>


        <h2>

            Create Student Account

        </h2>



        <form method="POST">


            <label>

                Full Name

            </label>


            <input

                type="text"

                name="name"

                placeholder="Enter your full name"

                required

            >



            <label>

                Email

            </label>


            <input

                type="email"

                name="email"

                placeholder="Enter your email"

                required

            >



            <label>

                Password

            </label>


            <input

                type="password"

                name="password"

                placeholder="Create a password"

                required

            >



            <button type="submit">

                Create Account

            </button>


        </form>



        <div class="login-link">

            Already have an account?

            <a href="/login">

                Login

            </a>

        </div>



        <div class="home-link">

            <a href="/">

                ← Back to Home

            </a>

        </div>


    </div>


</div>


</body>

</html>
