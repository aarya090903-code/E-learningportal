<!DOCTYPE html>
<html>
<head>
    <title>Study Notes</title>

    <style>
        body{
            font-family:Arial, sans-serif;
            background:#f2f2f2;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            color:#0d6efd;
            margin-bottom:30px;
        }

        table{
            width:80%;
            margin:auto;
            border-collapse:collapse;
            background:white;
            box-shadow:0 0 10px gray;
        }

        th{
            background:#0d6efd;
            color:white;
            padding:15px;
        }

        td{
            padding:15px;
            text-align:center;
            border-bottom:1px solid #ddd;
        }

        tr:hover{
            background:#f8f9fa;
        }

        .btn{
            background:#198754;
            color:white;
            padding:8px 18px;
            text-decoration:none;
            border-radius:5px;
        }

        .btn:hover{
            background:#157347;
        }

        .back{
            text-align:center;
            margin-top:30px;
        }

        .back a{
            text-decoration:none;
            color:white;
            background:#0d6efd;
            padding:10px 20px;
            border-radius:5px;
        }

    </style>

</head>

<body>

<h1>📄 Study Notes</h1>

<table>

<tr>
    <th>Title</th>
    <th>Download</th>
</tr>

{% for note in notes %}

<tr>

    <td>{{ note.title }}</td>

    <td>
        <a class="btn"
        href="{{ url_for('uploaded_file', filename=note.filename) }}"
        target="_blank">
        Open PDF
        </a>
    </td>

</tr>

{% endfor %}

</table>

<div class="back">
    <a href="/dashboard">⬅ Back to Dashboard</a>
</div>

</body>
</html>
